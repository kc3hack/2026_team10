services:
  db:
    image: mysql:8.4
    container_name: mysql
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$DB_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"
    restart: unless-stopped

  app:
    build: .
    container_name: go-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Tokyo
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "9090:80"
    restart: unless-stopped

volumes:
  db-data:
