services:
  app-front:
    image: ghcr.io/${GHCR_OWNER:-kc3hack}/team10-front:latest
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - app-back
    networks:
      - app-network

  app-back:
    image: ghcr.io/${GHCR_OWNER:-kc3hack}/team10-back:latest
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
