name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_FRONT: ghcr.io/${{ github.repository_owner }}/team10-front
  IMAGE_BACK: ghcr.io/${{ github.repository_owner }}/team10-back

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACK }}:latest
            ${{ env.IMAGE_BACK }}:${{ github.sha }}

      - name: Build and Push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONT }}:latest
            ${{ env.IMAGE_FRONT }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [web01.home, web02.home]

    steps:
      - name: Deploy to ${{ matrix.host }} via bastion
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.host }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: bastion.bearl27.com
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script_stop: true
          script: |
            set -eu
            if [ ! -d /home/ec2-user/2026_team10/.git ]; then
              git clone https://github.com/${{ github.repository }}.git /home/ec2-user/2026_team10
            fi
            cd /home/ec2-user/2026_team10
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker compose -f docker-compose.yaml pull
            docker compose -f docker-compose.yaml up -d --remove-orphans
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
