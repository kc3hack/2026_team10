name: Auto Label and Assign

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto_label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Auto Label
        uses: actions/labeler@v6.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  auto_assign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Auto Assign Author
        uses: toshimaru/auto-author-assign@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
